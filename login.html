<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Blood & Plasma Connect</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #fff5f5;
        }

        header {
            background-color: #b30000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .login-box {
            width: 90%;
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #b30000;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #b30000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #800000;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #b30000;
            text-decoration: none;
            font-weight: bold;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b30000;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🩸 Blood & Plasma Connect</h1>
    </header>

    <div class="login-box">

        <h2>Login</h2>

        <form action="login.php" method="POST">
            <label>Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

        <a class="home" href="index.html">
            ← Back to Home
        </a>

    </div>

</body>

</html>
