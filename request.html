<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Request</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #fff5f5;
        }

        header {
            background-color: #b30000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #b30000;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #b30000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #800000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b30000;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🩸 Blood & Plasma Connect</h1>
    </header>

    <div class="container">

        <h2>Blood Request Form</h2>

         <form action="save_request.php" method="POST">

            <label>Patient Name</label>
            <input type="text" id="name" name="patient_name" placeholder="Enter patient name">

            <label>Blood Group</label>

            <select id="bloodGroup" name="blood_group">
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label>Required Units</label>
            <input type="number" id="units" name="units" min="1" placeholder="Enter required units">

            <label>Hospital / Location</label>
            <input type="text" id="location" name="location" placeholder="Enter hospital or location">

            <label>Contact Number</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter contact number">

            <label>Additional Information</label>
            <textarea id="message" name="message" placeholder="Enter additional information"></textarea>

            <button type="submit">
                Submit Blood Request
            </button>

        </form>

        <a class="back" href="index.html">
            ← Back to Home
        </a>

    </div>

    <script>

        function submitRequest(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let bloodGroup = document.getElementById("bloodGroup").value;
            let units = document.getElementById("units").value;
            let location = document.getElementById("location").value;
            let contact = document.getElementById("contact").value;

            if (
                name === "" ||
                bloodGroup === "" ||
                units === "" ||
                location === "" ||
                contact === ""
            ) {
                alert("Please fill all required fields.");
                return;
            }

            alert("Blood request submitted successfully!");

        }

    </script>

</body>

</html>
