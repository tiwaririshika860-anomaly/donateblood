<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #fff5f5;
        }

        header {
            background-color: #b30000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #b30000;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #b30000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #800000;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #b30000;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>🩸 Blood & Plasma Connect</h1>
    </header>

    <div class="container">

        <h2>Create Account</h2>

        <form action="save_user.php" method="POST">

            <label>Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Create password">

            <label>User Type</label>

            <select id="userType" name="user_type">
                <option value="">Select User Type</option>
                <option>Donor</option>
                <option>Blood Seeker</option>
            </select>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</body>

</html>
